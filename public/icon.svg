<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Obsidian Luxury Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141722" />
      <stop offset="50%" stop-color="#0d1016" />
      <stop offset="100%" stop-color="#06080b" />
    </linearGradient>

    <!-- Outer Rim Luxury Atelier Accent -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5a464" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#c97a3e" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#2c3244" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#e08846" stop-opacity="0.8" />
    </linearGradient>

    <!-- Ambient Aurora Glow behind star -->
    <radialGradient id="auroraGlow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#f5a464" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#c97a3e" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0d1016" stop-opacity="0" />
    </radialGradient>

    <!-- Radiant Aurora Star Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fff4e0" />
      <stop offset="65%" stop-color="#f7a35a" />
      <stop offset="100%" stop-color="#c97a3e" />
    </linearGradient>

    <!-- Book Page Gradient (Linen Ivory) -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf6ee" />
      <stop offset="50%" stop-color="#eae2d4" />
      <stop offset="100%" stop-color="#cfc3af" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <!-- Star Glow Filter -->
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame (Standard iOS & Material 3 Superellipse) -->
  <rect 
    x="8" 
    y="8" 
    width="496" 
    height="496" 
    rx="112" 
    fill="url(#bgGrad)" 
    stroke="url(#borderGrad)" 
    stroke-width="5" 
  />

  <!-- Subtle Radial Ambient Light -->
  <circle cx="256" cy="180" r="160" fill="url(#auroraGlow)" />

  <!-- Master Emblem: Variant 01 - The Luminary Folio (Scaled Perfectly to 512x512) -->
  <g transform="translate(56, 56) scale(4)" filter="url(#softShadow)">
    
    <!-- Open Book Spread Fill (Translucent Ivory Paper Leaves) -->
    <path 
      d="M 20 72 C 32 64, 43 66, 50 74 C 57 66, 68 64, 80 72 L 80 50 C 68 42, 57 44, 50 52 C 43 44, 32 42, 20 50 Z" 
      fill="url(#pageGrad)" 
      opacity="0.95"
    />

    <!-- Symmetrical Open Book Wings Outline (Terracotta & Gold) -->
    <path 
      d="M 20 72 C 32 64, 43 66, 50 74 C 57 66, 68 64, 80 72 L 80 50 C 68 42, 57 44, 50 52 C 43 44, 32 42, 20 50 Z" 
      stroke="#c97a3e" 
      stroke-width="3" 
      stroke-linejoin="round" 
    />

    <!-- Center Spine Crease Line -->
    <line 
      x1="50" 
      y1="52" 
      x2="50" 
      y2="74" 
      stroke="#914517" 
      stroke-width="2.6" 
      stroke-linecap="round" 
    />

    <!-- The Rising Aurora 8-Point Star of Wisdom (Terracotta & Gold Foil) -->
    <path 
      d="M 50 14 Q 50 28, 64 28 Q 50 28, 50 42 Q 50 28, 36 28 Q 50 28, 50 14 Z" 
      fill="url(#starGrad)" 
      filter="url(#starGlow)"
    />

    <!-- Central Core Luminary Spark -->
    <circle cx="50" cy="28" r="2.2" fill="#ffffff" />

    <!-- Ambient Satellite Sparks -->
    <circle cx="28" cy="22" r="1.6" fill="#f5a464" opacity="0.8" />
    <circle cx="72" cy="22" r="1.6" fill="#f5a464" opacity="0.8" />
  </g>
</svg>
