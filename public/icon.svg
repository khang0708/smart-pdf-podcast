<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- App Rounded Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="512" height="512" rx="128" fill="url(#glow)" />

  <!-- Stylized Book Pages -->
  <path d="M128 360 C180 340, 230 350, 256 368 C282 350, 332 340, 384 360 L384 190 C332 170, 282 180, 256 198 C230 180, 180 170, 128 190 Z" 
        fill="#ffffff" 
        opacity="0.95" 
        filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.25))" />

  <path d="M256 198 L256 368" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />

  <!-- Stylized Podcast Headphones Arch over Book -->
  <path d="M140 260 C140 160, 372 160, 372 260" 
        fill="none" 
        stroke="#fcd34d" 
        stroke-width="28" 
        stroke-linecap="round" 
        filter="drop-shadow(0px 6px 12px rgba(0,0,0,0.3))" />

  <!-- Headphone Ear Cups -->
  <rect x="120" y="240" width="36" height="64" rx="18" fill="#fbbf24" />
  <rect x="356" y="240" width="36" height="64" rx="18" fill="#fbbf24" />

  <!-- Equalizer waves inside book -->
  <circle cx="210" cy="270" r="6" fill="#6366f1" />
  <circle cx="230" cy="260" r="6" fill="#6366f1" />
  <circle cx="282" cy="260" r="6" fill="#6366f1" />
  <circle cx="302" cy="270" r="6" fill="#6366f1" />
</svg>
