<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Reader — Logo Design Exploration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        .font-serif { font-family: 'Lora', Georgia, serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        .logo-card {
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .logo-card:hover {
            transform: translateY(-6px);
        }
        .logo-aura {
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            filter: blur(35px);
            pointer-events: none;
        }
        .logo-card:hover .logo-aura {
            opacity: 0.25;
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-[#0e1015] text-[#e5e7eb] min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // 1. The Luminary Folio
        const LogoLuminaryFolio = () => (
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" className="w-full h-full">
                <path d="M 20 72 C 32 64, 43 66, 50 74 C 57 66, 68 64, 80 72 L 80 50 C 68 42, 57 44, 50 52 C 43 44, 32 42, 20 50 Z" 
                      stroke="currentColor" strokeWidth="3.2" strokeLinejoin="round" />
                <line x1="50" y1="52" x2="50" y2="74" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" />
                <path d="M 50 14 Q 50 28, 64 28 Q 50 28, 50 42 Q 50 28, 36 28 Q 50 28, 50 14 Z" 
                      fill="currentColor" />
                <circle cx="50" cy="28" r="2.2" fill="#fff" />
                <circle cx="28" cy="22" r="1.5" fill="currentColor" opacity="0.5" />
                <circle cx="72" cy="22" r="1.5" fill="currentColor" opacity="0.5" />
            </svg>
        );

        // 2. The Edge Horizon
        const LogoEdgeHorizon = () => (
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" className="w-full h-full">
                <rect x="15" y="15" width="70" height="70" rx="20" stroke="currentColor" strokeWidth="2.2" opacity="0.35" />
                <line x1="28" y1="32" x2="72" y2="32" stroke="currentColor" strokeWidth="3.2" strokeLinecap="round" />
                <line x1="28" y1="43" x2="58" y2="43" stroke="currentColor" strokeWidth="2.8" strokeLinecap="round" opacity="0.75" />
                <path d="M 28 56 C 36 44, 44 68, 54 56 C 62 46, 66 56, 72 56" 
                      stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" />
                <circle cx="28" cy="56" r="4.5" fill="currentColor" />
                <circle cx="72" cy="56" r="4.5" fill="currentColor" />
                <line x1="36" y1="68" x2="64" y2="68" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" opacity="0.5" />
            </svg>
        );

        // 3. The Mobius Chronicle
        const LogoMobiusFolio = () => (
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" className="w-full h-full">
                <path d="M 32 38 C 20 38, 16 48, 16 58 C 16 68, 26 73, 36 67 C 46 61, 54 39, 64 33 C 74 27, 84 32, 84 42 C 84 52, 78 62, 68 62 C 58 62, 50 39, 40 33 C 34 29, 26 31, 22 36" 
                      stroke="currentColor" strokeWidth="3.6" strokeLinecap="round" strokeLinejoin="round" />
                <path d="M 66 62 L 66 78 L 71 74 L 76 78 L 76 60" 
                      fill="currentColor" opacity="0.9" />
                <circle cx="50" cy="50" r="3.5" fill="currentColor" />
            </svg>
        );

        // 4. The Acoustic Arch
        const LogoAcousticArch = () => (
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" className="w-full h-full">
                <path d="M 22 82 L 22 46 C 22 30, 35 18, 50 18 C 65 18, 78 30, 78 46 L 78 82" 
                      stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" />
                <line x1="16" y1="82" x2="84" y2="82" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" />
                <line x1="33" y1="74" x2="33" y2="58" stroke="currentColor" strokeWidth="3.2" strokeLinecap="round" />
                <line x1="41" y1="74" x2="41" y2="44" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" />
                <line x1="50" y1="74" x2="50" y2="34" stroke="currentColor" strokeWidth="4.2" strokeLinecap="round" />
                <line x1="59" y1="74" x2="59" y2="44" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" />
                <line x1="67" y1="74" x2="67" y2="58" stroke="currentColor" strokeWidth="3.2" strokeLinecap="round" />
                <circle cx="50" cy="25" r="2.5" fill="currentColor" />
            </svg>
        );

        // 5. The Constellation Folio
        const LogoConstellationFolio = () => (
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" className="w-full h-full">
                <path d="M 22 66 L 36 48 L 50 62 L 64 48 L 78 66" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" opacity="0.6" />
                <path d="M 36 48 L 50 24 L 64 48" stroke="currentColor" strokeWidth="2" strokeLinecap="round" opacity="0.6" />
                <line x1="50" y1="24" x2="50" y2="62" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" />
                <line x1="50" y1="62" x2="50" y2="78" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" />
                <circle cx="50" cy="24" r="5.5" fill="currentColor" />
                <circle cx="50" cy="62" r="4.5" fill="currentColor" />
                <circle cx="50" cy="78" r="3.5" fill="currentColor" />
                <circle cx="36" cy="48" r="4.2" fill="currentColor" />
                <circle cx="64" cy="48" r="4.2" fill="currentColor" />
                <circle cx="22" cy="66" r="3.8" fill="currentColor" />
                <circle cx="78" cy="66" r="3.8" fill="currentColor" />
                <circle cx="28" cy="30" r="1.8" fill="currentColor" opacity="0.4" />
                <circle cx="72" cy="30" r="1.8" fill="currentColor" opacity="0.4" />
            </svg>
        );

        // 6. The Atelier Monogram
        const LogoAtelierMonogram = () => (
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" className="w-full h-full">
                <path d="M 23 80 L 47 20 C 48.5 16, 51.5 16, 53 20 L 77 80" 
                      stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
                <line x1="16" y1="56" x2="84" y2="56" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" />
                <polygon points="50,32 41,52 59,52" fill="currentColor" opacity="0.22" />
                <circle cx="50" cy="42" r="2.8" fill="currentColor" />
                <line x1="18" y1="80" x2="30" y2="80" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" />
                <line x1="70" y1="80" x2="82" y2="80" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" />
            </svg>
        );

        const LOGO_DATA = [
            {
                id: 'luminary',
                title: 'The Luminary Folio',
                subtitle: 'Trang Sách Ánh Sáng (Khuyên Dùng)',
                pattern: 'Geometric Arcs + Negative Star Burst',
                Component: LogoLuminaryFolio,
                philosophy: 'Kết hợp hài hòa giữa hình khối hai trang sách mở và ngôi sao 8 cánh Aurora tỏa rạng. Ngôi sao đại diện cho trí tuệ khai phóng, vòm trang sách lượn sóng tạo cảm giác tĩnh tại, đậm chất văn chương cổ điển kết hợp công nghệ hiện đại.',
                bestFor: 'Thương hiệu xuất bản, độc giả yêu sách văn học, giao diện Atelier.'
            },
            {
                id: 'horizon',
                title: 'The Edge Horizon',
                subtitle: 'Đường Chân Trời Đồng Bộ',
                pattern: 'Typographic Line System + Sync Conduit',
                Component: LogoEdgeHorizon,
                philosophy: 'Lấy cảm hứng từ các dòng chữ in trang sách chuyển hóa thành làn sóng cực quang uốn lượn, kết nối giữa hai nút tròn (đại diện cho PC và Mobile). Thể hiện trọn vẹn sức mạnh đồng bộ dữ liệu tức thì của Cloudflare Edge.',
                bestFor: 'SaaS hiện đại, tốc độ cao, đồng bộ đa nền tảng.'
            },
            {
                id: 'mobius',
                title: 'The Mobius Chronicle',
                subtitle: 'Vòng Lặp Tri Thức Vô Tận',
                pattern: 'Continuous Topology + Ribbon Bookmark',
                Component: LogoMobiusFolio,
                philosophy: 'Dải ruy-băng đánh dấu trang sách uốn lượn thành biểu tượng vô cực (Infinity Loop). Biểu trưng cho dòng chảy tri thức bất tận, thói quen đọc sách không ngắt quãng và sự đồng hành trọn đời.',
                bestFor: 'Sản phẩm đọc bền vững, trải nghiệm liền mạch.'
            },
            {
                id: 'acoustic',
                title: 'The Acoustic Arch',
                subtitle: 'Cổng Vòm & Sóng Âm Ngôn Từ',
                pattern: 'Cathedral Arch + Soundwave Resonance',
                Component: LogoAcousticArch,
                philosophy: 'Cánh cổng vòm thư viện cổ kính che chở cho 5 thanh sóng âm thanh (Podcast Voice Frequencies). Đại diện hoàn hảo cho tính năng kép của ứng dụng: Vừa đọc sách PDF tĩnh lặng, vừa lắng nghe giọng đọc podcast ấm áp.',
                bestFor: 'Smart PDF + Podcast Reader, công nghệ Audio & AI.'
            },
            {
                id: 'constellation',
                title: 'The Constellation Folio',
                subtitle: 'Ma Trận Chòm Sao Tri Thức',
                pattern: 'Precision Dot Matrix + Network Graph',
                Component: LogoConstellationFolio,
                philosophy: 'Ma trận các điểm sáng tròn kết nối theo tỷ lệ vàng tạo nên hình ảnh một cuốn sách mở hướng lên bầu trời sao. Mỗi điểm là một ghi chú, một trang sách được liên kết thông minh qua đám mây.',
                bestFor: 'Kiến thức liên kết, Commonplace book, AI note-taking.'
            },
            {
                id: 'monogram',
                title: 'The Atelier Monogram',
                subtitle: 'Chữ A Kiến Trúc Hoàng Gia',
                pattern: 'Brutalist Monogram + Architectural Spire',
                Component: LogoAtelierMonogram,
                philosophy: 'Chữ cái A (Aurora) cách điệu quyền uy, với hai gáy sách vững chãi làm trụ đỡ và thanh ngang ruy-băng Terracotta. Mang tinh thần của các nhà xuất bản kinh điển Châu Âu như Faber & Faber hay Penguin Classics.',
                bestFor: 'Thương hiệu cao cấp, biểu tượng thương mại, uy tín học thuật.'
            }
        ];

        const THEMES = {
            obsidian: { id: 'obsidian', name: 'Dark Obsidian', bg: 'bg-[#0c0e14]', card: 'bg-[#151822]', border: 'border-[#272b3c]', text: 'text-stone-100', sub: 'text-stone-400' },
            sepia: { id: 'sepia', name: 'Warm Sepia', bg: 'bg-[#f4efe6]', card: 'bg-[#faf6ee]', border: 'border-[#e4dac6]', text: 'text-[#2a241d]', sub: 'text-[#7d7060]' },
            gallery: { id: 'gallery', name: 'Atelier Green', bg: 'bg-[#1b2b22]', card: 'bg-[#23382c]', border: 'border-[#334e3e]', text: 'text-[#eef5f0]', sub: 'text-[#9ab7a4]' },
            white: { id: 'white', name: 'Studio Pure', bg: 'bg-[#ffffff]', card: 'bg-[#f8f9fa]', border: 'border-stone-200', text: 'text-stone-900', sub: 'text-stone-500' }
        };

        const COLOR_TINTS = {
            terracotta: { id: 'terracotta', name: 'Terracotta (#c97a3e)', color: '#c97a3e', aura: 'rgba(201,122,62,0.4)' },
            gold: { id: 'gold', name: 'Amber Gold (#e8a87c)', color: '#e8a87c', aura: 'rgba(232,168,124,0.4)' },
            ivory: { id: 'ivory', name: 'Linen Ivory (#fdfcf7)', color: '#fdfcf7', aura: 'rgba(253,252,247,0.4)' },
            monochrome: { id: 'monochrome', name: 'Mono Charcoal (#1e212b)', color: '#1e212b', aura: 'rgba(30,33,43,0.4)' }
        };

        function App() {
            const [themeKey, setThemeKey] = useState('obsidian');
            const [tintKey, setTintKey] = useState('terracotta');
            const [selectedLogoId, setSelectedLogoId] = useState('luminary');
            const [copiedId, setCopiedId] = useState(null);

            const curTheme = THEMES[themeKey];
            const curTint = COLOR_TINTS[tintKey];
            const activeLogo = LOGO_DATA.find(l => l.id === selectedLogoId) || LOGO_DATA[0];

            const copySvgCode = (logo) => {
                // Generate raw SVG string
                const tempDiv = document.createElement('div');
                ReactDOM.render(<div style={{color: curTint.color}}><logo.Component /></div>, tempDiv);
                const svgStr = tempDiv.querySelector('svg').outerHTML;
                navigator.clipboard.writeText(svgStr).then(() => {
                    setCopiedId(logo.id);
                    setTimeout(() => setCopiedId(null), 2000);
                });
            };

            return (
                <div className={`min-h-screen ${curTheme.bg} ${curTheme.text} transition-colors duration-300 py-12 px-4 sm:px-8`}>
                    <div className="max-w-7xl mx-auto space-y-12">
                        
                        {/* Header */}
                        <header className="text-center space-y-4 max-w-3xl mx-auto pt-6">
                            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-mono tracking-widest uppercase border border-current/20 opacity-80">
                                <span>Logo Generator Skill</span>
                                <span>•</span>
                                <span className="text-[#c97a3e]">The Atelier Collection</span>
                            </div>
                            <h1 className="text-4xl sm:text-6xl font-serif font-bold tracking-tight">
                                Aurora Reader
                            </h1>
                            <p className="text-base sm:text-lg font-serif italic opacity-75">
                                Bộ nhận diện biểu trưng độc bản kết hợp giữa vẻ đẹp văn chương kinh điển và công nghệ kết nối siêu tốc
                            </p>

                            {/* Control Bar: Theme & Tint Switchers */}
                            <div className="pt-6 flex flex-wrap items-center justify-center gap-4 text-xs font-mono">
                                {/* Theme switcher */}
                                <div className="flex items-center gap-1.5 p-1 rounded-xl bg-black/20 border border-current/15">
                                    {Object.values(THEMES).map(t => (
                                        <button
                                            key={t.id}
                                            onClick={() => setThemeKey(t.id)}
                                            className={`px-3 py-1.5 rounded-lg transition-all ${
                                                themeKey === t.id ? 'bg-white/20 font-bold shadow-sm' : 'opacity-60 hover:opacity-100'
                                            }`}
                                        >
                                            {t.name}
                                        </button>
                                    ))}
                                </div>

                                {/* Tint switcher */}
                                <div className="flex items-center gap-1.5 p-1 rounded-xl bg-black/20 border border-current/15">
                                    {Object.values(COLOR_TINTS).map(c => (
                                        <button
                                            key={c.id}
                                            onClick={() => setTintKey(c.id)}
                                            className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all ${
                                                tintKey === c.id ? 'bg-white/20 font-bold shadow-sm' : 'opacity-60 hover:opacity-100'
                                            }`}
                                        >
                                            <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: c.color }} />
                                            <span>{c.name.split(' ')[0]}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </header>

                        {/* Hero Visual Mockup Banner */}
                        <div className="rounded-3xl overflow-hidden border border-current/15 shadow-2xl relative group">
                            <img 
                                src="/aurora_logo_showcase.jpg" 
                                alt="Aurora Reader Luxury Brand Mockup" 
                                className="w-full h-auto max-h-[460px] object-cover transition-transform duration-700 group-hover:scale-[1.01]"
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/25 to-transparent flex flex-col justify-end p-6 sm:p-10 text-white pointer-events-none">
                                <span className="text-xs font-mono text-[#e8a87c] uppercase tracking-widest mb-1">
                                    The Atelier Master Brand Presentation
                                </span>
                                <h3 className="text-2xl sm:text-3xl font-serif font-bold">
                                    The Luminary Folio — Biểu Trưng Dập Nổi Nhũ Vàng & Da Obsidian
                                </h3>
                                <p className="text-xs sm:text-sm font-serif italic text-stone-300 mt-1 max-w-2xl">
                                    Sự giao thoa hoàn hảo giữa cuốn sách mở của tri thức và ngôi sao cực quang dẫn lối.
                                </p>
                            </div>
                        </div>

                        {/* 6 Logo Variants Grid */}
                        <section className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {LOGO_DATA.map((logo, idx) => {
                                const isSelected = selectedLogoId === logo.id;
                                return (
                                    <div
                                        key={logo.id}
                                        onClick={() => setSelectedLogoId(logo.id)}
                                        className={`logo-card rounded-2xl p-6 sm:p-8 ${curTheme.card} border ${
                                            isSelected ? 'border-[#c97a3e] ring-2 ring-[#c97a3e]/30' : curTheme.border
                                        } relative flex flex-col justify-between cursor-pointer shadow-lg`}
                                    >
                                        {/* Aura Glow */}
                                        <div className="logo-aura" style={{ background: `radial-gradient(circle, ${curTint.aura} 0%, transparent 70%)` }} />

                                        <div>
                                            {/* Top Bar: Variant number & Recommended badge */}
                                            <div className="flex items-center justify-between text-xs font-mono opacity-60 mb-6">
                                                <span>VARIANT 0{idx + 1}</span>
                                                {logo.id === 'luminary' && (
                                                    <span className="px-2 py-0.5 rounded-full bg-[#c97a3e]/20 text-[#c97a3e] font-semibold">
                                                        Khuyên dùng
                                                    </span>
                                                )}
                                            </div>

                                            {/* Canvas Box */}
                                            <div className="w-full aspect-square max-w-[200px] mx-auto mb-8 flex items-center justify-center relative">
                                                <div 
                                                    className="w-28 h-28 sm:w-32 sm:h-32 transition-transform duration-500 hover:scale-110"
                                                    style={{ color: curTint.color }}
                                                >
                                                    <logo.Component />
                                                </div>
                                            </div>

                                            {/* Title & Pattern */}
                                            <div className="space-y-1.5 mb-4">
                                                <h3 className="text-xl font-serif font-bold tracking-tight">
                                                    {logo.title}
                                                </h3>
                                                <p className="text-xs font-mono text-[#c97a3e]">
                                                    {logo.subtitle}
                                                </p>
                                                <p className="text-[11px] font-mono opacity-50">
                                                    Pattern: {logo.pattern}
                                                </p>
                                            </div>

                                            {/* Philosophy */}
                                            <p className={`text-xs leading-relaxed ${curTheme.sub} font-serif`}>
                                                {logo.philosophy}
                                            </p>
                                        </div>

                                        {/* Bottom Action Footer */}
                                        <div className="pt-6 mt-6 border-t border-current/10 flex items-center justify-between text-xs font-mono">
                                            <button
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    copySvgCode(logo);
                                                }}
                                                className="px-3 py-1.5 rounded-lg bg-black/20 hover:bg-black/40 border border-current/15 transition-all flex items-center gap-1.5"
                                            >
                                                {copiedId === logo.id ? (
                                                    <span className="text-green-400 font-bold">✓ Đã chép SVG</span>
                                                ) : (
                                                    <span>Chép mã SVG</span>
                                                )}
                                            </button>
                                            <span className="text-[11px] opacity-60">
                                                {isSelected ? '● Đang chọn' : 'Nhấp để xem mẫu'}
                                            </span>
                                        </div>
                                    </div>
                                );
                            })}
                        </section>

                        {/* ================= REAL WORLD CONTEXT PREVIEW SECTION ================= */}
                        <section className={`rounded-3xl p-8 sm:p-12 ${curTheme.card} border ${curTheme.border} space-y-10 shadow-2xl`}>
                            <div className="border-b border-current/10 pb-6 flex flex-col sm:flex-row sm:items-end justify-between gap-4">
                                <div>
                                    <span className="text-xs font-mono text-[#c97a3e] uppercase tracking-wider block mb-1">
                                        Thực Tế Ứng Dụng (Contextual Mockup)
                                    </span>
                                    <h2 className="text-2xl sm:text-3xl font-serif font-bold">
                                        Mẫu thử logo: {activeLogo.title}
                                    </h2>
                                </div>
                                <div className="text-xs font-mono opacity-70">
                                    Đang thử nghiệm trực quan trên 3 kích thước cốt lõi
                                </div>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 items-stretch">
                                
                                {/* 1. Navbar Header Preview */}
                                <div className="p-6 rounded-2xl bg-[#090b0f] text-white border border-[#202434] space-y-4 flex flex-col justify-between">
                                    <div>
                                        <span className="text-[11px] font-mono text-stone-400 block mb-3">
                                            1. Thanh Header Web / App (Desktop & Mobile)
                                        </span>
                                        {/* Mockup Navbar */}
