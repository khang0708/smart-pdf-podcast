name = "aurora-reader-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "aurora-db"
database_id = "97f9ce72-ae46-4d11-83c5-ebc66008c218"

# Cloudflare R2 Object Storage Bucket Binding (Tùy chọn - Lưu trữ file PDF 0đ cước băng thông)
# Lưu ý: Cần kích hoạt R2 trên Cloudflare Dashboard (Storage & Databases -> R2) trước khi mở comment 3 dòng này.
# Nếu chưa kích hoạt R2, hệ thống vẫn chạy 100% các tính năng đồng bộ và tiến độ đọc qua Cloudflare D1!
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "aurora-pdf-files"

# Environment Variables
[vars]
JWT_SECRET = "aurora-secret-key-change-in-production-12345"
FREE_TIER_LIMIT_MB = 50
PRO_TIER_LIMIT_MB = 5120
